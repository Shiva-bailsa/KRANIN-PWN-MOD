name: Compile Pawn

on:
  workflow_dispatch:

jobs:
  compile:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project
  shell: powershell
  run: |
    $zip = Get-ChildItem -Filter "*.zip" | Select-Object -First 1
    if (-not $zip) {
      Write-Error "No ZIP file found in repository"
      exit 1
    }
    Write-Host "Using ZIP: $($zip.Name)"
    Expand-Archive -Path $zip.FullName -DestinationPath "project" -Force

      - name: Compile bykranin.pwn
        shell: cmd
        working-directory: project
        run: |
          pawno\pawncc.exe gamemodes\bykranin.pwn -ipawno\include -iinclude -ogamemodes\bykranin_english.amx

      - name: Upload compiled AMX
        uses: actions/upload-artifact@v4
        with:
          name: bykranin-English-AMX
          path: project/gamemodes/bykranin_english.amx
